name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        cache-dependency-glob: "pyproject.toml"

    - name: Install gRPC tools
      run: uv pip install grpcio-tools --system

    - name: Generate gRPC code
      run: |
        python -m grpc_tools.protoc -Isrc/tenso/grpc \
              --python_out=src/tenso/grpc \
              --grpc_python_out=src/tenso/grpc \
              src/tenso/grpc/tenso_msg.proto
        # Fix relative import for python 3
        sed -i 's/^import tenso_msg_pb2/from . import tenso_msg_pb2/' src/tenso/grpc/tenso_msg_pb2_grpc.py
              
    - name: Install dependencies
      # Installs the package in editable mode along with 'dev' dependencies
      # defined in your pyproject.toml (pytest, pyarrow, safetensors, etc.)
      run: |
        uv pip install --system -e ".[dev]"
        uv pip install --system pytest

    - name: Run tests
      run: |
        pytest -v
