name: Semantic Release & Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Prepare Release
    runs-on: ubuntu-latest
    concurrency: release
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9.15.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-wheels:
    name: Build wheels (${{ matrix.os }} ${{ matrix.target }})
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64 }
          - { os: ubuntu-latest,  target: aarch64 }
          - { os: macos-14,       target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      # --- 1. Generate gRPC Stubs (Must happen before build) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gRPC tools
        run: pip install grpcio-tools

      - name: Generate gRPC code
        shell: bash
        run: |
          python -m grpc_tools.protoc -Isrc --python_out=src --grpc_python_out=src src/tenso/grpc/tenso_msg.proto
          python -m grpc_tools.protoc -Isrc --python_out=src --grpc_python_out=src src/tenso/grpc/benchmark_msg.proto

      # --- 2. Cross-compilation support ---
      - name: Set up QEMU
        if: matrix.target == 'aarch64' && runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # --- 3. Build Rust/Python Wheels ---
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-sdist:
    name: Build source distribution
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gRPC tools
        run: pip install grpcio-tools

      - name: Generate gRPC code
        shell: bash
        run: |
          python -m grpc_tools.protoc -Isrc --python_out=src --grpc_python_out=src src/tenso/grpc/tenso_msg.proto
          python -m grpc_tools.protoc -Isrc --python_out=src --grpc_python_out=src src/tenso/grpc/benchmark_msg.proto

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [release, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: needs.release.outputs.released == 'true'
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
          
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      
      # Trigger documentation build after successful release
      - name: Trigger Documentation Build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: release-complete

  # ---------------------------------------------------------------------------
  # Native-library distribution (Rust crates + C ABI binaries). These run on the
  # same release as the PyPI publish and are kept independent of it.
  # ---------------------------------------------------------------------------
  publish-crates:
    name: Publish crates to crates.io
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      # Opt-in: only publishes when the CARGO_REGISTRY_TOKEN secret is configured,
      # so the release does not fail before crates.io publishing is set up.
      - name: Check for crates.io token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CARGO_REGISTRY_TOKEN not set - skipping crates.io publish."
          fi

      - name: Set up Rust toolchain
        if: steps.token.outputs.have == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Lock crate versions to the release version (lockstep)
        if: steps.token.outputs.have == 'true'
        run: |
          V="${{ needs.release.outputs.version }}"
          # workspace.package.version + the root crate version, and the internal
          # path-dependency version literals, all track the released version.
          sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"$V\"/" Cargo.toml
          sed -i -E "s/(tenso-(core|device|cuda) = \{ path = \"[^\"]+\", version = )\"[0-9]+\.[0-9]+\.[0-9]+\"/\1\"$V\"/" Cargo.toml

      - name: Publish in dependency order
        if: steps.token.outputs.have == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # cargo waits for each crate to appear in the index before returning,
          # so the dependents resolve the just-published versions.
          cargo publish -p tenso-core --allow-dirty
          cargo publish -p tenso-device --allow-dirty
          cargo publish -p tenso-cuda --allow-dirty
          cargo publish -p tenso-ffi --allow-dirty
          cargo publish -p tenso-bus --allow-dirty

  release-binaries:
    name: C ABI binaries (${{ matrix.name }})
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64 }
          - { os: macos-14,       name: macos-aarch64 }
          - { os: windows-latest, name: windows-x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build tenso-ffi (release)
        run: cargo build -p tenso-ffi --release

      - name: Stage C ABI bundle
        shell: bash
        run: |
          dir="tenso-ffi-${{ matrix.name }}"
          mkdir -p "$dir/lib" "$dir/include"
          cp include/tenso.h "$dir/include/"
          cp cpp/tenso.hpp "$dir/include/" 2>/dev/null || true
          # Copy whichever lib artifacts this OS produced (shared + static).
          cp target/release/libtenso_ffi.so    "$dir/lib/" 2>/dev/null || true
          cp target/release/libtenso_ffi.a     "$dir/lib/" 2>/dev/null || true
          cp target/release/libtenso_ffi.dylib "$dir/lib/" 2>/dev/null || true
          cp target/release/tenso_ffi.dll      "$dir/lib/" 2>/dev/null || true
          cp target/release/tenso_ffi.dll.lib  "$dir/lib/" 2>/dev/null || true
          cp target/release/tenso_ffi.lib      "$dir/lib/" 2>/dev/null || true
          tar czf "$dir.tar.gz" "$dir"

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: tenso-ffi-${{ matrix.name }}.tar.gz