[workspace]
members = [
    ".",
    "crates/tenso-core",
    "crates/tenso-ffi",
    "crates/tenso-device",
    "crates/tenso-cuda",
    "crates/tenso-bus",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.dependencies]
# Shared deps pinned once here; member crates reference them with
# `{ workspace = true }`. tenso-core MUST NOT depend on pyo3/numpy/libc.
lz4_flex = "0.11"
xxhash-rust = { version = "0.8.10", features = ["xxh3"] }
libc = "0.2"
libloading = "0.8"
cbindgen = "0.27"
# Internal path deps so crates can reference each other by `{ workspace = true }`.
tenso-core = { path = "crates/tenso-core" }
tenso-device = { path = "crates/tenso-device" }
tenso-cuda = { path = "crates/tenso-cuda" }

[package]
name = "tenso-rs"
version = "0.22.0"
edition = "2021"

[lib]
name = "tenso_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
# PyO3 is the bridge between Rust and Python
pyo3 = { version = "0.22", features = ["gil-refs", "abi3-py311"] }
libc = { workspace = true }
# The pure-Rust engine: single source of truth for the wire-format codec.
# Enable everything the dense + container encode/decode needs:
#   std         -> turns off no_std for std-only scaffolding
#   compression -> LZ4 frame encode/decode (compressed dense packets; implies std)
#   integrity   -> XXH3-64 footer encode/verify
tenso-core = { workspace = true, features = [
    "std",
    "compression",
    "integrity",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }