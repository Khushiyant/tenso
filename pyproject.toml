[project]
name = "tenso"
version = "0.19.3"
description = "High-performance zero-copy tensor protocol"
readme = "README.md"
dependencies = [
    "lz4>=4.4.5",
    "numpy",
    "xxhash>=3.6.0",
]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"


[tool.maturin]
python-source = "src"          # Your python code is in src/
module-name = "tenso.tenso_rs" # This compiles the rust binary as a submodule
features = ["pyo3/extension-module"]

[project.optional-dependencies]
api = [
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "fastapi", 
    "uvicorn",
    "ray[default]>=2.9.0"
]
dev = [
    "maturin>=1.10.2",
    "httpx>=0.28.1",
    "myst-parser>=4.0.1",
    "furo>=2025.9.25",
    "pytest-asyncio>=1.3.0",
    "psutil>=7.1.3",
    "msgpack>=1.1.2",
    "pyarrow>=22.0.0",
    "safetensors>=0.7.0",
    "build>=1.3.0",
    "pytest>=9.0.1",
    "twine>=6.2.0",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-rtd-theme>=3.0.0",
    "ml_dtypes>=0.4.0",
]
gpu = [
    "cupy-cuda12x; sys_platform != 'darwin'",
    "torch",
    "jax[cuda]; sys_platform != 'darwin'",
    "jax; sys_platform == 'darwin'"
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "echo 'Skipping build in semantic-release, handled by CI'"
