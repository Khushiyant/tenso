[project]
name = "tenso"
version = "0.24.0"
description = "High-performance zero-copy tensor protocol"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Khushiyant", email = "khushiyant2002@gmail.com" }]
keywords = ["tensor", "serialization", "zero-copy", "ipc", "simd", "numpy", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # No "License ::" classifier: PEP 639 supersedes it with the SPDX
    # `license` expression above, and PyPI rejects uploads carrying both.
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "lz4>=4.4.5",
    "numpy",
    "xxhash>=3.6.0",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://khushiyant.github.io/tenso/"
Repository = "https://github.com/Khushiyant/tenso"
Documentation = "https://khushiyant.github.io/tenso/"
Changelog = "https://github.com/Khushiyant/tenso/blob/main/CHANGELOG.md"
Issues = "https://github.com/Khushiyant/tenso/issues"

[project.optional-dependencies]
api = [
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "fastapi", 
    "uvicorn",
    "ray[default]>=2.9.0"
]
dev = [
    "maturin>=1.10.2",
    "httpx>=0.28.1",
    "myst-parser>=4.0.1",
    "furo>=2025.9.25",
    "pytest-asyncio>=1.3.0",
    "psutil>=7.1.3",
    "msgpack>=1.1.2",
    "pyarrow>=22.0.0",
    "safetensors>=0.7.0",
    "build>=1.3.0",
    "pytest>=9.0.1",
    "twine>=6.2.0",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-rtd-theme>=3.0.0",
    "ml_dtypes>=0.4.0",
    "hypothesis>=6.0.0",
]
gpu = [
    "cupy-cuda12x; sys_platform != 'darwin'",
    "torch",
    "jax[cuda]; sys_platform != 'darwin'",
    "jax; sys_platform == 'darwin'"
]





[tool.setuptools.packages.find]
where = ["src"]


[tool.maturin]
python-source = "src"          # Your python code is in src/
module-name = "tenso.tenso_rs" # This compiles the rust binary as a submodule
features = ["pyo3/extension-module"]

[tool.semantic_release]
# Cargo.toml is bumped here too, so a release tag carries a Cargo version that
# matches the Python one. Previously only pyproject.toml was bumped and the
# tagged tree kept a stale Cargo version, which the release workflow then had to
# sed-rewrite at publish time.
version_toml = [
    "pyproject.toml:project.version",
    "Cargo.toml:workspace.package.version",
    "Cargo.toml:package.version",
]
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "echo 'Skipping build in semantic-release, handled by CI'"




[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"


