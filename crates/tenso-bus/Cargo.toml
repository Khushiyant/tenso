[package]
name = "tenso-bus"
version = "0.22.0"
edition = "2021"
description = "Shared-memory tensor bus (ring + latest-value buffer) built over tenso-core."
license = "MIT"

[lib]
name = "tenso_bus"

[features]
default = []

[dependencies]
tenso-core = { workspace = true }
# SHM + POSIX primitives live behind libc; bus is a host/std crate.
libc = { workspace = true }
