[package]
name = "tenso-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Stable C ABI for the Tenso core (cdylib + staticlib); cbindgen generates include/tenso.h."

[lib]
name = "tenso_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []

# integrity (XXH3) + compression (LZ4) so the C ABI has full parity with the
# Python binding — C/C++ callers can use check_integrity/compress.
[dependencies]
tenso = { workspace = true, features = ["integrity", "compression"] }

[build-dependencies]
cbindgen = { workspace = true }
