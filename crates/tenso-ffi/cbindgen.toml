language = "C"
header = "/* Tenso C ABI — AUTO-GENERATED by cbindgen from crates/tenso-ffi. DO NOT EDIT BY HAND. */"
include_guard = "TENSO_H"
pragma_once = false
autogen_warning = "/* This file is regenerated by `cargo build -p tenso-ffi`. */"
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "doxy"
style = "type"

[defines]

[export]
# No export prefix: the Rust types/consts are already `tenso_`/`Tenso`/`TENSO_`
# prefixed by hand, so an extra prefix here would double it (TensoTensoView).
include = []
exclude = []

[export.rename]

[enum]
prefix_with_name = true
rename_variants = "QualifiedScreamingSnakeCase"

[fn]
prefix = ""
postfix = ""
args = "auto"
rename_args = "none"

[parse]
parse_deps = true
include = ["tenso-core"]

[parse.expand]
crates = []
